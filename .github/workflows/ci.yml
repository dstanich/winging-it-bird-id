# Required checks for PRs into main: server tests, client lint/test/build, publish script sanity check.
# No path filters on purpose: required checks that never run would block merging.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run lint
        working-directory: client
      - run: npm test
        working-directory: client
      # The build reads client/data/bird-data.db (symlink → server/data), so create one with the real schema
      - run: npm ci --omit=dev
        working-directory: server
      - run: node scripts/seed-ci-db.js
        working-directory: server
        env:
          DATA_DIR: data
      - run: npm run build
        working-directory: client

  publish-script:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/scripts/scheduled-publish
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/scripts/scheduled-publish/package-lock.json
      - run: npm ci
      - run: node --check index.js
