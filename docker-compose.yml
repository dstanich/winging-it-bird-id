# Production deployment: FTP/processing server + scheduled S3 publisher.
#
#   docker compose up -d --build   # first start, or after `git pull`
#   docker compose up -d           # after editing server/.env or client/.env (recreates changed containers)
#   docker compose logs -f server
#
# Env comes from server/.env and client/.env at runtime (never baked into the images).
# Volumes are external so compose never creates or deletes them; create them once with
#   docker volume create birdid-data && docker volume create birdid-downloads && docker volume create birdid-uploads
# TZ must be the camera's time zone: Reolink filenames carry local timestamps, which the server parses as clip IDs.

services:
  server:
    build: ./server
    env_file: ./server/.env
    environment:
      TZ: America/Chicago
    ports:
      - "2121:2121" # FTP control; must match FTP_PORT
      - "30100-30110:30100-30110" # FTP passive range; must match FTP_PASV_MIN/FTP_PASV_MAX
    volumes:
      - birdid-data:/app/data
      - birdid-downloads:/app/downloads
      - birdid-uploads:/app/uploads # failed clips wait here to be retried, so keep them across recreates
    restart: unless-stopped

  publish:
    build: ./client
    env_file: ./client/.env
    environment:
      TZ: America/Chicago # pages hard-code America/Chicago; this just keeps log times consistent
    volumes:
      # Read-write: SQLite in WAL mode needs to write its -shm file even for read-only connections
      - birdid-data:/app/data
      - birdid-downloads:/app/public/downloads
    restart: unless-stopped

volumes:
  birdid-data:
    external: true
  birdid-downloads:
    external: true
  birdid-uploads:
    external: true
